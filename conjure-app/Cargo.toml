[package]
name = "conjure-app"
version.workspace = true
edition.workspace = true

[dependencies]
conjure-agent = { path = "../conjure-agent" }
conjure-core = { path = "../conjure-core" }
conjure-export = { path = "../conjure-export" }
conjure-inference = { path = "../conjure-inference" }
conjure-store = { path = "../conjure-store" }
rune = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2", features = ["tooling", "native-file-dialog"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
httpmock = "0.8"
