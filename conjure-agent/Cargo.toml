[package]
name = "conjure-agent"
version.workspace = true
edition.workspace = true

[dependencies]
conjure-core = { path = "../conjure-core" }
conjure-inference = { path = "../conjure-inference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
httpmock = "0.8"
