[package]
name = "conjure-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.23"
conjure-agent = { path = "../conjure-agent" }
conjure-core = { path = "../conjure-core" }
conjure-export = { path = "../conjure-export" }
conjure-inference = { path = "../conjure-inference" }
conjure-store = { path = "../conjure-store" }
rmcp = { version = "3.11", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
httpmock = "0.8"
rmcp = { version = "3.11", features = ["client"] }
tokio = { version = "1", features = ["io-util"] }
